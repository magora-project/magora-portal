# label-gate (repo harness spec §5.3): exactly one depth label. The job's pass/fail IS the check;
# it posts no commit status, because a fork PR's read-only token cannot write one.
# Labels are read live from the API when the job runs (not from the event payload), so removing a
# label re-evaluates. Each run reports on the head SHA its event carried.
# Same-repo PRs also get auto-labelling (AUTO_LABEL; see scripts/ci/label-gate.mjs): a PR opened with
# no depth label gets one inferred from its changed paths, and a person's label replaces the bot's.
# Fork and Dependabot PRs get a read-only token, so for them the gate only judges.
# Concurrency is keyed on the PR, not the head SHA: labels belong to the PR, so a run for an older
# head must finish its label writes before a newer head's run reads them. Runs queue
# (cancel-in-progress: false). GitHub keeps one queued run per group and cancels the older queued
# one, in order of arrival, not by head. So a manual re-run of an OLD commit's run (or, rarely, a
# late-delivered event) can cancel the current head's queued run. Its check then shows cancelled:
# re-run label-gate on the PR's latest commit. A cancelled run on a superseded head is expected.
name: label-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # auto-label: add or remove a depth label on same-repo PRs
  issues: read
  # Dispatch gemini-review.yml after the bot applies subtle-correctness (GEMINI_DISPATCH). A label
  # written with this token starts no `labeled` run, so without this that head gets no Gemini review.
  # Fork PRs get a read-only token whatever this says.
  actions: write

concurrency:
  group: label-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label-gate:
    name: label-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/label-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTO_LABEL: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
          # gemini-review.yml reviews only PRs into main.
          GEMINI_DISPATCH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.base.ref == 'main' }}
