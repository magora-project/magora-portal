name: storage-backup

# Nightly copy of every Supabase Storage bucket into R2. Runs on main only.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: backup
    steps:
      - name: Refuse to run off main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "storage-backup runs on refs/heads/main only" >&2
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Copy and check every bucket
        env:
          RCLONE_CONFIG_SUPABASE_TYPE: s3
          RCLONE_CONFIG_SUPABASE_PROVIDER: Other
          RCLONE_CONFIG_SUPABASE_ENDPOINT: https://wqxmmuwrfltpaxnuddwk.supabase.co/storage/v1/s3
          RCLONE_CONFIG_SUPABASE_REGION: ${{ vars.SUPABASE_S3_REGION }}
          RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          today="$(date -u +%F)"

          # Newest nightly/ prefix strictly earlier than today (UTC); empty on the first night.
          # Exit 3 is rclone's "directory not found" (no nightly/ yet); any other failure is fatal.
          rc=0
          listing="$(rclone lsf --dirs-only "r2:${R2_BUCKET}/nightly/")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "listing nightly/ failed with rclone exit ${rc}" >&2
            exit 1
          fi
          prev=""
          if [ "$rc" -eq 0 ]; then
            prev="$(printf '%s\n' "$listing" \
              | sed 's:/$::' \
              | { grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true; } \
              | awk -v today="$today" '$0 < today' \
              | sort | tail -n 1)"
          fi
          if [ -n "$prev" ]; then
            echo "Previous backup prefix: nightly/${prev}/"
          else
            echo "No earlier backup prefix; copying without --copy-dest"
          fi

          buckets="$(rclone lsf --dirs-only supabase: | sed 's:/$::')"
          if [ -z "$buckets" ]; then
            echo "No Storage buckets listed; refusing to report success" >&2
            exit 1
          fi

          failed=0
          while IFS= read -r bucket; do
            [ -n "$bucket" ] || continue
            dest="r2:${R2_BUCKET}/nightly/${today}/${bucket}"
            echo "== ${bucket}"
            args=(--checksum)
            if [ -n "$prev" ]; then
              args+=(--copy-dest "r2:${R2_BUCKET}/nightly/${prev}/${bucket}")
            fi
            if ! rclone copy "supabase:${bucket}" "$dest" "${args[@]}"; then
              echo "copy failed for ${bucket}" >&2
              failed=1
              continue
            fi
            if ! rclone check "supabase:${bucket}" "$dest" --checksum --one-way; then
              echo "check failed for ${bucket}" >&2
              failed=1
            fi
          done <<< "$buckets"

          exit "$failed"
