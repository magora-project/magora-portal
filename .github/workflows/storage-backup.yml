name: storage-backup

# Nightly copy of every Supabase Storage bucket into R2. Runs on main only.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: backup
    steps:
      - name: Refuse to run off main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "storage-backup runs on refs/heads/main only" >&2
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Copy and check every bucket
        env:
          RCLONE_CONFIG_SUPABASE_TYPE: s3
          RCLONE_CONFIG_SUPABASE_PROVIDER: Other
          RCLONE_CONFIG_SUPABASE_ENDPOINT: https://wqxmmuwrfltpaxnuddwk.supabase.co/storage/v1/s3
          RCLONE_CONFIG_SUPABASE_REGION: ${{ vars.SUPABASE_S3_REGION }}
          RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          today="$(date -u +%F)"

          # A prefix already marked complete is never written again: a same-day rerun could add
          # newer objects to it and then fail on a locked one, leaving a mixed copy under a marker
          # that restores trust. On S3/R2 a missing complete/ lists as empty with exit 0; exit 3
          # ("directory not found", other backends) is accepted the same way. Any other failure is fatal.
          rc=0
          markers="$(rclone lsf --files-only "r2:${R2_BUCKET}/complete/")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "listing complete/ failed with rclone exit ${rc}" >&2
            exit 1
          fi
          if printf '%s\n' "$markers" | grep -qxF "$today"; then
            # A warning annotation, so the run summary shows this run copied and checked nothing.
            echo "::warning::nightly/${today}/ is already marked complete (complete/${today}); this run copied and checked nothing"
            exit 0
          fi

          # Newest nightly/ prefix strictly earlier than today (UTC); empty on the first night.
          # On S3/R2 a missing nightly/ lists as empty with exit 0; exit 3 ("directory not found",
          # other backends) is accepted the same way. Any other failure is fatal.
          rc=0
          listing="$(rclone lsf --dirs-only "r2:${R2_BUCKET}/nightly/")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "listing nightly/ failed with rclone exit ${rc}" >&2
            exit 1
          fi
          prev=""
          if [ "$rc" -eq 0 ]; then
            prev="$(printf '%s\n' "$listing" \
              | sed 's:/$::' \
              | { grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true; } \
              | awk -v today="$today" '$0 < today' \
              | sort | tail -n 1)"
          fi
          if [ -n "$prev" ]; then
            echo "Previous backup prefix: nightly/${prev}/"
          else
            echo "No earlier backup prefix; copying without --copy-dest"
          fi

          buckets="$(rclone lsf --dirs-only supabase: | sed 's:/$::')"
          if [ -z "$buckets" ]; then
            echo "No Storage buckets listed; refusing to report success" >&2
            exit 1
          fi

          # --checksum falls back to size only when either side of a comparison has no MD5 (e.g. a
          # multipart upload), so --copy-dest could keep a changed object of the same size and the
          # check would still pass. Prints how many objects under $1 have no MD5; fails if the
          # listing fails. A missing MD5 prints as spaces; no awk interval syntax, for mawk.
          count_no_md5() {
            local sums
            sums="$(rclone md5sum "$1" </dev/null)" || return 1
            printf '%s\n' "$sums" \
              | awk 'NF && !(substr($0, 33, 2) == "  " && substr($0, 1, 32) ~ /^[0-9a-f]+$/) { n++ } END { print n + 0 }'
          }

          failed=0
          while IFS= read -r bucket; do
            [ -n "$bucket" ] || continue
            dest="r2:${R2_BUCKET}/nightly/${today}/${bucket}"
            echo "== ${bucket}"
            if ! nohash="$(count_no_md5 "supabase:${bucket}")"; then
              echo "::error::${bucket}: listing MD5s failed; not copied"
              failed=1
              continue
            fi
            if [ "$nohash" -ne 0 ]; then
              echo "::error::${bucket}: ${nohash} object(s) without an MD5; not copied (see docs/runbooks/storage-backup.md)"
              failed=1
              continue
            fi
            args=(--checksum)
            if [ -n "$prev" ]; then
              args+=(--copy-dest "r2:${R2_BUCKET}/nightly/${prev}/${bucket}")
            fi
            if ! rclone copy "supabase:${bucket}" "$dest" "${args[@]}"; then
              echo "::error::${bucket}: copy failed"
              failed=1
              continue
            fi
            if ! rclone check "supabase:${bucket}" "$dest" --checksum --one-way; then
              echo "::error::${bucket}: check failed"
              failed=1
              continue
            fi
            # Recount both sides after the check: an object overwritten without an MD5 while the
            # bucket was copied, or a copy in R2 that has none, was compared by size only.
            if ! src_nohash="$(count_no_md5 "supabase:${bucket}")" || ! dst_nohash="$(count_no_md5 "$dest")"; then
              echo "::error::${bucket}: listing MD5s after the check failed"
              failed=1
              continue
            fi
            if [ "$src_nohash" -ne 0 ] || [ "$dst_nohash" -ne 0 ]; then
              echo "::error::${bucket}: after the check, ${src_nohash} source and ${dst_nohash} backup object(s) without an MD5"
              failed=1
            fi
          done <<< "$buckets"

          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi

          # Every bucket copied and checked: mark nightly/${today}/ complete. The marker is
          # outside nightly/, so no restore copies it. Restores pick only marked dates.
          printf '%s\n' "${GITHUB_RUN_ID:-}" | rclone rcat "r2:${R2_BUCKET}/complete/${today}"
          echo "Marked complete: complete/${today} (prefix nightly/${today}/)"
