name: storage-backup

# Nightly copy of every Supabase Storage bucket into R2. Runs on main only.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: backup
    steps:
      - name: Refuse to run off main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "storage-backup runs on refs/heads/main only" >&2
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Copy and check every bucket
        env:
          RCLONE_CONFIG_SUPABASE_TYPE: s3
          RCLONE_CONFIG_SUPABASE_PROVIDER: Other
          RCLONE_CONFIG_SUPABASE_ENDPOINT: https://wqxmmuwrfltpaxnuddwk.supabase.co/storage/v1/s3
          RCLONE_CONFIG_SUPABASE_REGION: ${{ vars.SUPABASE_S3_REGION }}
          RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          today="$(date -u +%F)"

          # A prefix already marked complete is never written again: a same-day rerun could add
          # newer objects to it and then fail on a locked one, leaving a mixed copy under a marker
          # that restores trust. On S3/R2 a missing complete/ lists as empty with exit 0; exit 3
          # ("directory not found", other backends) is accepted the same way. Any other failure is fatal.
          rc=0
          markers="$(rclone lsf --files-only "r2:${R2_BUCKET}/complete/")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "listing complete/ failed with rclone exit ${rc}" >&2
            exit 1
          fi
          if printf '%s\n' "$markers" | grep -qxF "$today"; then
            # A warning annotation, so the run summary shows this run copied and checked nothing.
            echo "::warning::nightly/${today}/ is already marked complete (complete/${today}); this run copied and checked nothing"
            exit 0
          fi

          # Newest nightly/ prefix strictly earlier than today (UTC); empty on the first night.
          # On S3/R2 a missing nightly/ lists as empty with exit 0; exit 3 ("directory not found",
          # other backends) is accepted the same way. Any other failure is fatal.
          rc=0
          listing="$(rclone lsf --dirs-only "r2:${R2_BUCKET}/nightly/")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "listing nightly/ failed with rclone exit ${rc}" >&2
            exit 1
          fi
          prev=""
          if [ "$rc" -eq 0 ]; then
            prev="$(printf '%s\n' "$listing" \
              | sed 's:/$::' \
              | { grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true; } \
              | awk -v today="$today" '$0 < today' \
              | sort | tail -n 1)"
          fi
          if [ -n "$prev" ]; then
            echo "Previous backup prefix: nightly/${prev}/"
          else
            echo "No earlier backup prefix; copying without --copy-dest"
          fi

          buckets="$(rclone lsf --dirs-only supabase: | sed 's:/$::')"
          if [ -z "$buckets" ]; then
            echo "No Storage buckets listed; refusing to report success" >&2
            exit 1
          fi

          # --checksum falls back to size only when either side of a comparison has no MD5 (e.g. a
          # multipart upload), so --copy-dest could keep a changed object of the same size, and
          # rclone check passes such a comparison ("hashes could not be checked"). So the job reads
          # MD5s itself with `rclone md5sum`, whose lines are "<32 hex>  <path>"; a missing MD5
          # prints as spaces. No awk interval syntax, for mawk.
          # stdin: md5sum lines. Prints how many carry no MD5.
          no_md5() {
            awk 'NF && !(substr($0, 33, 2) == "  " && substr($0, 1, 32) ~ /^[0-9a-f]+$/) { n++ } END { print n + 0 }'
          }
          # $1: backup md5sum lines, $2: source md5sum lines. Prints how many paths present on both
          # sides have different MD5s. Paths only on one side are left to rclone check.
          md5_mismatches() {
            awk 'NR == FNR { if (length($0) > 34) d[substr($0, 35)] = substr($0, 1, 32); next }
                 length($0) > 34 && (substr($0, 35) in d) && d[substr($0, 35)] != substr($0, 1, 32) { n++ }
                 END { print n + 0 }' <(printf '%s\n' "$1") <(printf '%s\n' "$2")
          }

          failed=0
          while IFS= read -r bucket; do
            [ -n "$bucket" ] || continue
            dest="r2:${R2_BUCKET}/nightly/${today}/${bucket}"
            echo "== ${bucket}"
            if ! src_sums="$(rclone md5sum "supabase:${bucket}" </dev/null)"; then
              echo "::error::${bucket}: listing MD5s failed; not copied"
              failed=1
              continue
            fi
            nohash="$(printf '%s\n' "$src_sums" | no_md5)"
            if [ "$nohash" -ne 0 ]; then
              echo "::error::${bucket}: ${nohash} object(s) without an MD5; not copied (see docs/runbooks/storage-backup.md)"
              failed=1
              continue
            fi
            args=(--checksum)
            if [ -n "$prev" ]; then
              args+=(--copy-dest "r2:${R2_BUCKET}/nightly/${prev}/${bucket}")
            fi
            if ! rclone copy "supabase:${bucket}" "$dest" "${args[@]}"; then
              echo "::error::${bucket}: copy failed"
              failed=1
              continue
            fi
            check_rc=0
            check_log="$(rclone check "supabase:${bucket}" "$dest" --checksum --one-way 2>&1)" || check_rc=$?
            printf '%s\n' "$check_log"
            if [ "$check_rc" -ne 0 ]; then
              echo "::error::${bucket}: check failed"
              failed=1
              continue
            fi
            # A pass that compared some object by size only ("N hashes could not be checked") is
            # not a pass: that object may be a stale --copy-dest carry-over.
            if grep -Eq '[1-9][0-9]* hashes could not be checked' <<< "$check_log"; then
              echo "::error::${bucket}: check compared some objects by size only"
              failed=1
              continue
            fi
            # The check may have compared some objects by size only, so after it compare the MD5s
            # here: neither side may lack one, and every path on both sides must match. Backup is
            # listed first, so a source change in between shows as a mismatch, never a pass.
            if ! dst_sums="$(rclone md5sum "$dest" </dev/null)" || ! src_sums="$(rclone md5sum "supabase:${bucket}" </dev/null)"; then
              echo "::error::${bucket}: listing MD5s after the check failed"
              failed=1
              continue
            fi
            src_nohash="$(printf '%s\n' "$src_sums" | no_md5)"
            dst_nohash="$(printf '%s\n' "$dst_sums" | no_md5)"
            mismatched="$(md5_mismatches "$dst_sums" "$src_sums")"
            if [ "$src_nohash" -ne 0 ] || [ "$dst_nohash" -ne 0 ] || [ "$mismatched" -ne 0 ]; then
              echo "::error::${bucket}: after the check, ${src_nohash} source and ${dst_nohash} backup object(s) without an MD5, ${mismatched} with different MD5s"
              failed=1
            fi
          done <<< "$buckets"

          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi

          # Every bucket copied and checked: mark nightly/${today}/ complete. The marker is
          # outside nightly/, so no restore copies it. Restores pick only marked dates.
          printf '%s\n' "${GITHUB_RUN_ID:-}" | rclone rcat "r2:${R2_BUCKET}/complete/${today}"
          echo "Marked complete: complete/${today} (prefix nightly/${today}/)"
