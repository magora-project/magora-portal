# Gemini second-vendor review on same-repo PRs labelled `subtle-correctness`.
#
# It posts a COMMENT, no commit status, and is not a required check, deliberately. In method-project (where this
# workflow originated), `coderabbit-review` was the cautionary case: a
# required-looking check that fail-opens, and whose green routinely means "not
# objecting" rather than "reviewed". A new reviewer earns a status after it has been watched, never on
# the day it ships. Until then this informs a human and blocks nothing.
#
# FOUR DECISIONS, each of which a naive copy of Google's example gets wrong here
# -----------------------------------------------------------------------------
# 1. `pull_request`, NEVER `pull_request_target`. The latter runs with secrets
#    in the BASE repo's context against untrusted PR code, which is the classic
#    secret-exfiltration shape. With `pull_request` a fork PR simply receives no
#    secret, so this fails CLOSED. The `if:` below makes that explicit rather
#    than leaving it to a confusing empty-key failure.
#
# 3. `synchronize` is included, so the review describes the FINAL head. A review
#    is a property of a SHA: method-project has a recorded case of two PRs merging
#    with green reviewer checks that described commits the branches had already
#    moved past. `concurrency` below cancels a superseded run so the extra
#    trigger costs one job per head, not one per push.
#
# 4. A FAILED REVIEW IS LOUD. The job fails and comments saying so. The sharpest
#    friction of 2026-09-20 in method-project was the Codex App declining SILENTLY on two PRs --
#    no "rate limited", no "already reviewed", just an absent submission, which
#    is indistinguishable by inspection from one that has not run yet. An absent
#    review must never be mistakable for a clean one.
#
#    Making that TRUE took two corrections, both found by this workflow reviewing
#    ITSELF: the runner's default `-e` killed the review step before it could
#    record its status, and the comment step was then skipped. Neither was caught
#    by a YAML parse, `bash -n`, or a dry-run of the comment builder, because all
#    three exercise the happy path.
#
# 5. THE REVIEWER RUNS FROM THE TRUSTED BASE, NEVER FROM THE PR (method-project#2747 H1). A
#    `pull_request` workflow checks out the PR's merge ref, so the PR's OWN copy
#    of `scripts/review/gemini_review.py` used to run with `GEMINI_API_KEY` in its
#    environment -- a same-repo branch could rewrite the script to exfiltrate the
#    key, and the checkout's persisted token besides. The script and the
#    `AGENTS.md` it reads as review rules now come from `base.sha`, a commit on
#    the protected base branch. The PR tree is
#    only ever DIFFED, never executed. `persist-credentials: false` on both
#    checkouts keeps the job token out of `.git/config`. RESIDUAL, NOT MITIGATED
#    BY REVIEW: this YAML runs from the PR ref on open, before any review, so a
#    PR editing these steps can read the key. Bounded by push access; method-project#2834.
#    label-gate's `workflow_dispatch` runs (issue #58) use main's YAML, because label-gate
#    dispatches with `ref: main`. The job's `refs/heads/main` guard only stops main-guarded copies
#    from running on other refs: a pusher who dispatches on their own branch runs that branch's
#    YAML, which can drop the guard. That is the same push-access residual as above.
#
# COST: method-project's 2026-08-16 Actions audit cut two sweeps because GitHub bills
# every job rounded UP to a whole minute. This adds one job per PR head, and the
# `concurrency` cancel is what keeps a rapid push sequence from paying per push.
name: Gemini review
# Quoted whole: unquoted, YAML reads ` #` as a comment and the title would be `Gemini review PR`. A
# dispatched run (label-gate, a maintainer) runs on `main` with no PR association, so this
# `display_title` is the only place the API shows which PR it reviews (Tasks 22 and 23 match on it).
run-name: 'Gemini review PR #${{ github.event.pull_request.number || inputs.pr_number }}'

on:
  pull_request:
    # `edited` is for a retarget (issue #62): a stacked PR that GitHub moves onto main after its base
    # merges fires only `edited`, so without it that head got no review until its next push. An
    # `edited` run with no base change (title, body) skips, and takes a `-noop-` group below so it
    # cannot cancel a review in flight. `branches:` filters on the NEW base.
    types: [opened, reopened, ready_for_review, synchronize, labeled, edited]
    branches: [main]
  # label-gate.yml dispatches this (on `main`) after its bot applies `subtle-correctness`: a label
  # written with the workflow token starts no `labeled` run, and the `pull_request` runs judge the
  # event payload's labels, so that head would otherwise get no review (issue #58). A dispatched run
  # reads the PR from the API and reviews its CURRENT head. A maintainer can also run it by hand.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review (digits only)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Per PR, not per repo: two PRs must review in parallel. Cancel-in-progress
  # drops a run whose head has already been superseded -- its verdict would
  # describe a SHA nobody will merge.
  # A run that will skip gets a unique group (suffix `-noop-<run_id>`), so it cannot cancel a
  # review already in flight for the same PR (such as one label-gate just dispatched): a
  # `pull_request` run for a `labeled` event of any other label or whose payload lacks
  # `subtle-correctness`, an `edited` run that did not change the base, and a dispatch on any ref
  # but main.
  # Accepted cost: a push to a PR whose label was just changed away from `subtle-correctness` no
  # longer cancels a review in flight for the previous head; that review still posts, naming its SHA.
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number }}${{ ((github.event_name == 'pull_request' && ((github.event.action == 'labeled' && github.event.label.name != 'subtle-correctness') || (github.event.action == 'edited' && !github.event.changes.base) || !contains(github.event.pull_request.labels.*.name, 'subtle-correctness'))) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  gemini-review:
    name: gemini-review
    runs-on: ubuntu-latest
    # Backstop for the step timeout below. A job timeout is a cancellation, so the post step does not
    # run; Task 22 treats that as a terminal failure.
    timeout-minutes: 25
    # A draft PR is parked by intent; `ready_for_review` above is what fires when it
    # is unparked. The fork predicate is decision 1: a fork PR has no secret, so
    # it is skipped explicitly rather than failing on an empty key.
    # A dispatched run must come from `main`, so its YAML is the protected branch's, never a
    # branch's; the "Resolve the PR" step applies the same predicates to the PR read from the API.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'subtle-correctness') &&
      (github.event.action != 'labeled' || github.event.label.name == 'subtle-correctness') &&
      (github.event.action != 'edited' || github.event.changes.base))
    steps:
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          EV_NUMBER: ${{ github.event.pull_request.number }}
          EV_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EV_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EV_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          # One source of PR facts for every later step: the payload on `pull_request` (the job's
          # `if:` already judged it), the API on `workflow_dispatch`. Inputs and API values reach
          # this script through env only, never as an expression in the script text. The title goes to a
          # file, not $GITHUB_OUTPUT, where a newline in it could forge an output. Nothing is
          # checked out yet; `-I` keeps the cwd and PYTHON* env off sys.path anyway.
          python3 -I - <<'PY'
          import json, os, re, sys, urllib.request
          env = os.environ
          repo = env["GITHUB_REPOSITORY"]
          def out(**kv):
              with open(env["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  for k, v in kv.items():
                      fh.write(f"{k}={v}\n")
          if env["EVENT_NAME"] == "pull_request":
              number, base, head, title = env["EV_NUMBER"], env["EV_BASE_SHA"], env["EV_HEAD_SHA"], env["EV_TITLE"]
          else:
              number = env["INPUT_PR"]
              if not re.fullmatch(r"[1-9][0-9]{0,9}", number):
                  sys.exit(f"pr_number must be a positive integer with no spaces, got {number!r}")
              req = urllib.request.Request(
                  f"{env.get('GITHUB_API_URL', 'https://api.github.com')}/repos/{repo}/pulls/{number}",
                  headers={"Authorization": f"Bearer {env['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  pr = json.load(r)
              labels = [l["name"] for l in pr.get("labels", [])]
              # The same predicates as the job's `if:` for `pull_request`, judged on the live PR.
              skip = [why for why, bad in [
                  ("it is not open", pr["state"] != "open"),
                  ("it is a draft", pr.get("draft")),
                  ("its base is not main", pr["base"]["ref"] != "main"),
                  ("it is from a fork", (pr["head"].get("repo") or {}).get("full_name") != repo),
                  ("it is a Dependabot PR", pr["user"]["login"] == "dependabot[bot]"),
                  ("it is not labelled subtle-correctness", "subtle-correctness" not in labels),
              ] if bad]
              if skip:
                  print(f"not reviewing PR #{number}: " + "; ".join(skip))
                  out(run="false")
                  sys.exit(0)
              base, head, title = pr["base"]["sha"], pr["head"]["sha"], pr["title"]
          for sha in (base, head):
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  sys.exit(f"unexpected sha {sha!r}")
          with open(os.path.join(env["RUNNER_TEMP"], "pr-title"), "w", encoding="utf-8") as fh:
              fh.write(title)
          out(run="true", number=number, base_sha=base, head_sha=head)
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.pr.outputs.run == 'true'
        with:
          # `pull_request`: the default merge ref. `workflow_dispatch`: the PR's head commit
          # (only ever diffed, decision 5).
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.pr.outputs.head_sha || '' }}
          # The base ref must be present to diff against, and checkout fetches
          # only the merge ref by default.
          fetch-depth: 0
          # Decision 5: this tree is PR-controlled and is only diffed. No step
          # needs the job token in `.git/config`, so it is not left there.
          persist-credentials: false

      - name: Checkout the trusted reviewer (base, not PR)
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Decision 5. `base.sha` is on the protected base branch; a PR cannot
          # write there, so the script it holds cannot be the PR's rewrite.
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted
          persist-credentials: false
          # Cone mode always includes root files, so `AGENTS.md` comes with it.
          sparse-checkout: scripts/review

      # Node comes from the trusted base's `.nvmrc` (root files ride along with the cone-mode
      # sparse-checkout, as does `scripts/review/identity.mjs`).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pr.outputs.run == 'true'
        with:
          node-version-file: trusted/.nvmrc
          # No package-manager cache: its default can run npm in the PR checkout (when the PR's
          # package.json names npm in `packageManager`) with a token in the environment.
          package-manager-cache: false

      - name: Build the review diff
        if: steps.pr.outputs.run == 'true'
        id: diff
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Three dots: the changes THIS PR introduces, not everything the base
          # gained since the branch was cut. Scoped by COMMIT RANGE, with ONE path exclusion: the
          # `.review/` evidence directory, which no change depends on. Any other path filter hides a
          # file the change depends on and yields a confident finding about wiring that is present
          # all along (measured in method-project, 2026-09-20).
          # The diff is built by the TRUSTED base's `geminiDiff`, the one builder the gate's size
          # check also uses, so both measure the same bytes. The PR tree is only the git repo it
          # reads; none of its code runs. Both commits are present (fetch-depth 0).
          node --input-type=module -e "
            import { pathToFileURL } from 'node:url'
            import { writeFileSync } from 'node:fs'
            const { geminiDiff } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/trusted/scripts/review/identity.mjs').href)
            writeFileSync('/tmp/review.diff', await geminiDiff({ cwd: process.env.GITHUB_WORKSPACE, base: process.env.BASE_SHA, head: process.env.HEAD_SHA }))
          "
          echo "bytes=$(wc -c < /tmp/review.diff)" >> "$GITHUB_OUTPUT"

      - name: Skip a repeat of an earlier verdict
        if: steps.pr.outputs.run == 'true'
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          # V5: the same input identity (the trusted base's `inputIdentity`) with a completed verdict
          # already on the PR means the model is not called again.
          # Every failure to DECIDE (identity, comment listing, a crash in the parser) prints a
          # notice and falls through to a normal review with skip=false and exit 0: a wasted model
          # call is cheaper than a missing review. `skip` and `identity` are written to
          # $GITHUB_OUTPUT exactly once, below. The one failure that is not swallowed is posting the
          # skip comment: the earlier same-identity verdict still exists, so skip stays true, the
          # model is not called, and the job goes RED with no new comment.
          skip=false
          rm -f "$RUNNER_TEMP/skip.json"
          identity="$(node --input-type=module -e "
            import { pathToFileURL } from 'node:url'
            const { inputIdentity } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/trusted/scripts/review/identity.mjs').href)
            process.stdout.write(await inputIdentity({ cwd: process.env.GITHUB_WORKSPACE, base: process.env.BASE_SHA, head: process.env.HEAD_SHA }))
          ")" || identity=""
          if [ -z "$identity" ]; then
            echo "no identity; reviewing"
          # Only `github-actions[bot]`'s comments count, read from the API (all pages).
          elif ! gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | {url: .html_url, body: .body, created: .created_at, updated: .updated_at}' \
            > "$RUNNER_TEMP/comments.jsonl"; then
            echo "could not list comments; reviewing"
          else
            # `-I`: the cwd is the PR checkout and GH_TOKEN is in the env. Any crash is a notice,
            # not a failed step; it leaves no skip.json, so the review runs.
            IDENTITY="$identity" python3 -I - <<'PY' || echo "skip check failed; reviewing"
          import json, math, os, re, sys
          try:
              env = os.environ
              marker = re.compile(r"^<!-- gemini-review:v1 (\{.*\}) -->$", re.MULTILINE)

              # A marker counts only in the shape scripts/review/github.mjs `geminiVerdicts` accepts
              # (scripts/ci/gemini-verdict.test.mjs checks the two agree), narrowed to the verdicts a
              # skip may rest on. `could-not-run` and `skipped-same-identity` never qualify, so a run
              # whose findings could not be read is reviewed again.
              def no_constant(name):
                  raise ValueError(name)  # JSON.parse refuses NaN and Infinity; json.loads would not

              def js_integer(x):
                  # Number.isInteger: a finite number with no fraction. A JSON bool is not a number.
                  if isinstance(x, bool) or not isinstance(x, (int, float)):
                      return False
                  try:
                      f = float(x)
                  except OverflowError:
                      return False  # JSON.parse reads it as Infinity
                  return math.isfinite(f) and f.is_integer()

              def valid_finding(f):
                  return isinstance(f, dict) and js_integer(f.get("index")) and f.get("severity") in ("P0", "P1")

              def skippable(m):
                  return (isinstance(m, dict)
                          and isinstance(m.get("head"), str) and m["head"] != ""
                          and m.get("identity") == env["IDENTITY"]
                          and m.get("verdict") in ("no-findings", "findings")
                          and isinstance(m.get("findings"), list)
                          and all(valid_finding(f) for f in m["findings"]))

              earlier = None
              with open(os.path.join(env["RUNNER_TEMP"], "comments.jsonl"), encoding="utf-8") as fh:
                  for raw in fh:
                      try:
                          c = json.loads(raw)
                      except ValueError:
                          continue
                      # A comment edited after posting is ignored: a maintainer can rewrite a bot
                      # comment's marker without its login changing, so only an unedited one
                      # (updated_at == created_at) counts as the bot's own verdict.
                      if c.get("updated") != c.get("created"):
                          continue
                      found = marker.findall(c.get("body") or "")
                      if len(found) != 1:
                          continue
                      try:
                          m = json.loads(found[0], parse_constant=no_constant)
                      except ValueError:
                          continue
                      if skippable(m):
                          earlier = c["url"]
              if earlier is None:
                  print("no earlier verdict for this identity; reviewing")
                  sys.exit(0)
              sha, ident = env["HEAD_SHA"], env["IDENTITY"]
              meta = {"head": sha, "identity": ident, "verdict": "skipped-same-identity", "findings": []}
              body = (
                  "## Gemini review: skipped\n\n"
                  f"Head `{sha}` has the same input identity as an earlier Gemini verdict, {earlier}, "
                  "so the model was not called again. That comment's findings still apply.\n\n"
                  "---\n_Posted by gemini-review.yml (Gemini, advisory; not a required check)_\n"
                  "<!-- gemini-review:v1 " + json.dumps(meta, separators=(",", ":")) + " -->"
              )
              with open(os.path.join(env["RUNNER_TEMP"], "skip.json"), "w", encoding="utf-8") as fh:
                  json.dump({"body": body}, fh)
          except SystemExit:
              raise
          except Exception as exc:
              print(f"skip check crashed ({exc!r}); reviewing")
              try:
                  os.unlink(os.path.join(os.environ["RUNNER_TEMP"], "skip.json"))
              except OSError:
                  pass
          PY
            if [ -s "$RUNNER_TEMP/skip.json" ]; then skip=true; fi
          fi
          { echo "identity=$identity"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "$RUNNER_TEMP/skip.json" > /dev/null || {
              echo "could not post the skip comment; the earlier verdict stands, the model is not called" >&2
              exit 1
            }
          fi

      - name: Run the Gemini pass
        if: steps.pr.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        id: review
        # A stalled model call fails THIS step, so the post step still writes `could-not-run`.
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -uo pipefail
          PR_TITLE="$(cat "$RUNNER_TEMP/pr-title")"
          # 🔴 `|| rc=$?` IS LOAD-BEARING, AND `set -uo pipefail` DOES NOT MAKE IT
          # REDUNDANT. GitHub's default shell for a `run:` step is `bash -e {0}`,
          # so `-e` is ALREADY ON before this script's first line, and `set -uo
          # pipefail` ADDS options without clearing it (measured: under `bash -e`,
          # `$-` still contains `e` afterwards). Without the `||`, a non-zero exit
          # from the script would kill this step at that line, `rc` would never be
          # written, and the comment step below would be SKIPPED -- so a review
          # that could not run would produce no explanation at all, which is the
          # whole thing decision 4 exists to prevent.
          #
          # A non-zero exit here is a REPORTABLE outcome, not a reason to abandon
          # the job before it can say so: "could not review" and "found nothing"
          # must not become the same signal.
          #
          # Found by this workflow's own SECOND run (method-project#2682). Its FIRST run's
          # finding about the post step was a FALSE POSITIVE for the same reason
          # -- it assumed `-e` was absent, when the runner supplies it.
          rc=0
          # Decision 5: the TRUSTED copy, and its rules too -- a PR editing
          # `AGENTS.md` must not also rewrite the rules it is reviewed against.
          # Fail CLOSED if the base lacks the script: never fall back to the PR's own copy, which is the vector.
          if [ ! -f trusted/scripts/review/gemini_review.py ] || [ ! -f trusted/AGENTS.md ]; then
            echo "trusted base $BASE_SHA lacks scripts/review/gemini_review.py or AGENTS.md; refusing to run the PR's own copy" > /tmp/review.err
            rc=1
          else
            # `--` before the title: a PR titled `--help` otherwise prints usage and exits 0, and
            # that usage text would be posted as the review (Gemini's own finding on this PR).
            python3 trusted/scripts/review/gemini_review.py --rules trusted/AGENTS.md -- "$PR_TITLE" \
              < /tmp/review.diff > /tmp/review.out 2> /tmp/review.err || rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Post the review
        # `success() || failure()` rather than `always()`: this must still run
        # when an earlier step failed, because explaining the failure IS its job
        # -- but `always()` would ALSO fire on a cancellation, and the
        # concurrency guard above cancels superseded runs deliberately. A
        # comment about a head nobody will merge is noise on the PR.
        #
        # `steps.pr.outputs.run`: a dispatched run that decided not to review posts nothing. If
        # the resolve step itself failed, that output is unset, so nothing posts and the job is
        # red -- visible on the Actions tab, not on the PR.
        if: (success() || failure()) && steps.pr.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_RC: ${{ steps.review.outputs.rc }}
          DIFF_BYTES: ${{ steps.diff.outputs.bytes }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          IDENTITY: ${{ steps.skip.outputs.identity }}
        run: |
          set -uo pipefail
          # python3 + curl rather than actions/github-script. method-project never
          # used that action, so there was no vetted pin to copy, and an
          # unverified digest is worse than none: the run fails "unable to
          # resolve action" and reads as a config error. python3 and curl are
          # already how method-project's other workflow logic talked to the API.
          #
          # 🔴 `-I` IS LOAD-BEARING. This step's working directory is the PR's
          # merge checkout and GH_TOKEN is in its env. `python3 -` puts '' (the
          # cwd) FIRST on sys.path, so a PR adding a root-level `json.py` would
          # be imported by the line below and run with the token (measured).
          # Isolated mode drops the cwd from sys.path and ignores PYTHON* env.
          python3 -I - <<'PY' > /tmp/comment.json
          import json, os, re
          rc = os.environ["REVIEW_RC"]
          sha = os.environ["HEAD_SHA"]
          nbytes = os.environ["DIFF_BYTES"]
          def read(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return fh.read().strip()
              except OSError:
                  return ""
          out, err = read("/tmp/review.out"), read("/tmp/review.err")
          # Model and stderr text must not carry a marker of its own (a diff can steer the model
          # into emitting one): defang the opener so the one real marker below is the only one.
          out, err = out.replace("<!--", "<! --"), err.replace("<!--", "<! --")
          findings = []
          verdict = "could-not-run"

          # The SHA is named in EVERY outcome. A verdict is a property of a
          # commit; a comment that does not say which one cannot be told apart
          # from one describing a head the branch has already moved past.
          if rc != "0":
              body = (
                  "## Gemini review could not run\n\n"
                  f"Head `{sha}`. This is **not** a clean review: the pass failed "
                  "before returning a verdict, so this PR has no Gemini coverage.\n\n"
                  "```\n" + (err[-1500:] or "(no stderr)") + "\n```"
              )
          elif out == "NO FINDINGS":
              verdict = "no-findings"
              body = (f"## Gemini review: no findings\n\nHead `{sha}`, {nbytes} byte diff.")
          else:
              # `gemini_review.py` numbers each finding line `N. P1 | ...`. Parsed from the SAME
              # truncated text that is posted, so the marker never names an index the comment omits.
              out = out[:55000]
              findings = [{"index": int(i), "severity": sev.upper()}
                          for i, sev in re.findall(r"^(\d+)\. (P[01])\b", out, re.MULTILINE | re.IGNORECASE)]
              if findings:
                  verdict = "findings"
                  body = (
                      "## Gemini review\n\n"
                      f"Head `{sha}`, {nbytes} byte diff. Advisory: this posts no commit status, and is not a required check. "
                      "It gates nothing. Verify each finding against source before acting on it -- "
                      "a measured false positive rate is why this is a second opinion and not "
                      "an oracle.\n\n```\n" + out + "\n```"
                  )
              else:
                  # The model reported findings but no line is numbered (a trusted base whose
                  # gemini_review.py predates numbering emits them unnumbered). A `findings` verdict
                  # with no findings would read as clean to the gate and make this identity
                  # skippable, so the verdict stays `could-not-run`: never skip-eligible, and the
                  # next run on the same identity reviews again.
                  body = (
                      "## Gemini review could not be read\n\n"
                      f"Head `{sha}`, {nbytes} byte diff. The pass returned findings, but none is numbered "
                      "`N. P0 | ...` or `N. P1 | ...`, so none can be cited: this is recorded as a review "
                      "that could not run, not as coverage, and a later run on the same input identity "
                      "reviews again. The unparsed output, unverified:\n\n```\n" + out + "\n```"
                  )
          body += "\n\n---\n_Posted by gemini-review.yml (Gemini, advisory; not a required check)_"
          # Exactly one marker, last, for every outcome (Task 21 parses it).
          meta = {"head": sha, "identity": os.environ.get("IDENTITY", ""), "verdict": verdict, "findings": findings}
          body += "\n<!-- gemini-review:v1 " + json.dumps(meta, separators=(",", ":")) + " -->"
          print(json.dumps({"body": body}))
          PY

          # curl's status is captured so the failure can be DESCRIBED, not to
          # stop it being swallowed. `-e` is on here (the runner's default shell
          # is `bash -e {0}`), so an unchecked non-zero from curl would already
          # turn the job red -- correctly. What the capture buys is the two lines
          # below it: a specific message, and the unpostable comment written to
          # the job log so the findings survive a rejected POST instead of dying
          # with it. Keep both; neither is what `-e` gives you for free.
          #
          # ⚠️ THIS COMMENT SAID THE OPPOSITE UNTIL A FOLLOW-UP COMMIT IN method-project -- that
          # the step ran WITHOUT `-e` and an unchecked curl failure would go
          # green. That is FALSE, and a reader who believed it would add error
          # handling the default shell already provides, or worse, trust the
          # claim elsewhere. It came from this workflow's own FIRST self-review,
          # which was a false positive; the SECOND found the real defect and
          # disproved the first. The commit message and this file's header were
          # corrected then and this comment was missed, which is how a
          # disproven premise survives in the one place people actually read.
          post_rc=0
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            > /dev/null || post_rc=$?

          if [ "$post_rc" != "0" ]; then
            echo "could not post the review comment (curl exit $post_rc)" >&2
            # The findings survive in the job log rather than being lost with
            # the failed POST. A review nobody can read is worth less than one
            # buried in a log, but it is not worth nothing.
            echo "--- the review that could not be posted ---" >&2
            cat /tmp/comment.json >&2
            exit 1
          fi

          # Decision 4: fail the job so an absent review is VISIBLE. This is not
          # a required check, so it blocks no merge -- it only stops a review
          # that never happened from being indistinguishable from a clean one.
          if [ "$REVIEW_RC" != "0" ]; then
            echo "gemini_review.py exited $REVIEW_RC" >&2
            exit 1
          fi
